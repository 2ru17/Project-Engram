<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="engram-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f17"/>
      <stop offset="50%" stop-color="#070a0f"/>
      <stop offset="100%" stop-color="#040609"/>
    </linearGradient>
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#0077B6"/>
    </linearGradient>
    <linearGradient id="bezel-stroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#4B5E78" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="0.8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#engram-bg)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" stroke="url(#bezel-stroke)" stroke-width="2" stroke-opacity="0.5"/>

  <!-- Orbital Astrolabe Rings -->
  <circle cx="256" cy="256" r="190" stroke="#4B5E78" stroke-width="1.5" stroke-opacity="0.25" stroke-dasharray="8 6"/>
  <circle cx="256" cy="256" r="148" stroke="#00E5FF" stroke-width="1" stroke-opacity="0.3" stroke-dasharray="4 8"/>
  <circle cx="256" cy="256" r="110" stroke="#4B5E78" stroke-width="1" stroke-opacity="0.35"/>

  <!-- Cardinal Tick Markers -->
  <line x1="256" y1="46" x2="256" y2="76" stroke="#00E5FF" stroke-width="3" stroke-linecap="round"/>
  <line x1="256" y1="436" x2="256" y2="466" stroke="#00E5FF" stroke-width="3" stroke-linecap="round"/>
  <line x1="46" y1="256" x2="76" y2="256" stroke="#00E5FF" stroke-width="3" stroke-linecap="round"/>
  <line x1="436" y1="256" x2="466" y2="256" stroke="#00E5FF" stroke-width="3" stroke-linecap="round"/>

  <!-- Outer Diamond Bezel -->
  <g transform="rotate(45 256 256)">
    <rect x="146" y="146" width="220" height="220" rx="28" fill="#0d1420" fill-opacity="0.8" stroke="url(#cyan-glow)" stroke-width="4" filter="url(#glow)"/>
    <rect x="166" y="166" width="180" height="180" rx="16" stroke="#4B5E78" stroke-width="1.5" stroke-opacity="0.5"/>
  </g>

  <!-- Center Core Hanko Monogram / Stylized Kanji (銘 / Engram) -->
  <g filter="url(#glow)">
    <!-- Central Diamond Core -->
    <polygon points="256,196 306,256 256,316 206,256" fill="url(#cyan-glow)" fill-opacity="0.2" stroke="#00E5FF" stroke-width="2.5"/>
    <circle cx="256" cy="256" r="14" fill="#00E5FF"/>
    <circle cx="256" cy="256" r="6" fill="#0b0f17"/>

    <!-- Corner Accents -->
    <circle cx="256" cy="196" r="4" fill="#00E5FF"/>
    <circle cx="256" cy="316" r="4" fill="#00E5FF"/>
    <circle cx="206" cy="256" r="4" fill="#00E5FF"/>
    <circle cx="306" cy="256" r="4" fill="#00E5FF"/>
  </g>
</svg>
