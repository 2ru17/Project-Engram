name: Engram Notes & Architecture Governance

on:
  push:
    branches:
      - v2
      - main
  pull_request:
    branches:
      - v2
      - main

concurrency:
  group: engram-governance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  governance:
    name: Validate Notes, Lint, Typecheck & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run vault & architecture governance validator
        run: npm run validate:notes

      - name: Run TypeScript typecheck
        run: npm run typecheck

      - name: Run ESLint
        run: npm run lint

      - name: Run unit tests (if present)
        run: npm run test --if-present

      - name: Run Next.js production build
        run: npm run build

      - name: Append Build & Typecheck Status to Step Summary
        if: always()
        run: |
          if [ -n "$GITHUB_STEP_SUMMARY" ]; then
            echo "| Build & Typecheck Status | ${{ job.status }} |" >> "$GITHUB_STEP_SUMMARY"
          fi
